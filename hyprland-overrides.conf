# Hyprland configuration overrides
# Add your custom settings here

# Example overrides:
# $mainMod = SUPER

# Autostart
#exec-once = uwsm-app -- hyprsunset
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Keybindings
unbind = SUPER, COMMA # Dismiss last notification
unbind = SUPER, BACKSPACE # Toggle window transparency
unbind = SUPER, Slash # Toggle window scaling
unbind = SUPER, P, # Pseudo window
unbind = SUPER, T, # Toggle window floating/tiling
unbind = SUPER, O, # Pop window out (float & pin)
unbind = SUPER SHIFT, RETURN # Browser
unbind = SUPER SHIFT, SLASH # 1Password
unbind = SUPER SHIFT, SPACE # Toggle top bar
unbind = SUPER SHIFT, G # Signal
unbind = SUPER SHIFT, W # Typora
unbind = SUPER SHIFT, C # Calendar
unbind = SUPER SHIFT, E # Email
unbind = SUPER SHIFT, X # X
unbind = SUPER SHIFT, P # Google Photos
unbind = SUPER SHIFT, Y # Youtube
unbind = SUPER SHIFT ALT, G # Whatsapp
unbind = SUPER SHIFT ALT, A # Grok
unbind = SUPER SHIFT ALT, COMMA # Restore last notification
unbind = SUPER SHIFT ALT, X # X Post
unbind = SUPER ALT, RETURN # Tmux
unbind = SUPER ALT, SPACE # Omarchy Menu
unbind = SUPER ALT, COMMA # Invoke last notification
unbind = SUPER ALT, F # Full width
unbind = SUPER CTRL, SPACE # Next background in theme
unbind = SUPER CTRL, F # Tiled full screen
unbind = SUPER CTRL, I # Toggle locking idle
unbind = SUPER CTRL, X, # Toggle dictation
unbind = SUPER SHIFT, BACKSPACE # Toggle window gaps
unbind = SUPER SHIFT CTRL, SPACE # Theme Menu
unbind = SUPER SHIFT CTRL, G # Google Messages
unbind = SUPER CTRL ALT, B # Show battery remaining
unbind = SUPER CTRL ALT, T # Show time
unbind = CTRL ALT, DELETE # Close all windows
unbind = SUPER SHIFT ALT, G # Google Messages

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
unbind = SUPER SHIFT ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
unbind = SUPER SHIFT ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
unbind = SUPER SHIFT ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
unbind = SUPER SHIFT ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
unbind = SUPER SHIFT ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
unbind = SUPER SHIFT ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
unbind = SUPER SHIFT ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
unbind = SUPER SHIFT ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
unbind = SUPER SHIFT ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
unbind = SUPER SHIFT ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

bindd = SUPER, T, Toggle window floating/tiling, exec, omarchy-hyprland-window-pop
bindd = SUPER CTRL, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER CTRL, F, Full width, fullscreen, 1
bindd = SUPER CTRL ALT, COMMA, Invoke last notification, exec, makoctl invoke
# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bindd = SUPER CTRL ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER CTRL ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER CTRL ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER CTRL ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER CTRL ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER CTRL ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER CTRL ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER CTRL ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER CTRL ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER CTRL ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

general {
    gaps_in = 3
    gaps_out = 5

    border_size = 1
}

input {
#   kb_layout = latam
#   # kb_layout = us
#   # kb_options = grp:alt_shift_toggle
  kb_options = grep:caps_toggle

  follow_mouse = 1

#   # Change speed of keyboard repeat
#   repeat_rate = 40
#   repeat_delay = 600
}

decoration {
    rounding = 10
    rounding_power = 1
}

# Monitors
monitor = DP-1, highres, 0x0, 1.67
monitor = DP-2, highres, 2560x0, 1.25, transform, 3

cursor {
    hide_on_key_press = false
    default_monitor = DP-1
}
